<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - LiveCanvas</title>

    <link rel="icon" type="image/png" href="assets/logo.png">


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Authentication CSS -->

    <link rel="stylesheet"
          href="auth.css">

</head>


<body>


    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-visual">
                <img src="assets/login.png" alt="Login visual">
            </div>

            <div class="auth-form">

                <!-- Logo -->

                <div class="auth-logo">
                    <img src="assets/logo_bg.png" alt="LiveCanvas" class="auth-logo-img">
                    <h2>LiveCanvas</h2>
                </div>


                <!-- Heading -->

                <h1>Welcome Back!</h1>

                <p class="subtitle">
                    Login to continue to your whiteboard
                </p>


                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email">

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password">

                </div>


                <p id="formMessage" class="form-message" aria-live="polite"></p>

                <!-- Login Button -->

                <button id="loginBtn">

                    <!-- <i class="fa-solid fa-right-to-bracket"></i> -->

                    Login

                </button>


                <!-- Signup -->

                <p class="switch-text">

                    Don't have an account?

                    <a href="signup.html">
                        Create Account
                    </a>

                </p>


                <!-- Back -->

                <!-- <p class="back-text">

                    <a href="index.html">
                        Back to Whiteboard
                    </a>

                </p> -->

            </div>

        </div>

    </div>


    <!-- Login JavaScript -->

    <script>
        const existingUser = localStorage.getItem('loggedInUser');
        if (existingUser) {
            window.location.href = 'saved.html';
        }
    </script>
    <script src="login.js"></script>
    <script src="cursor.js"></script>

</body>

</html>
