<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Saved Boards - LiveCanvas</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Use same handwritten script font family as home page -->
    <style>
        :root{ --card-bg: #ffffff }
        body{ background: #f7f6f2; font-family: Poppins, sans-serif }
        .container{
            min-height: calc(100vh - 84px);
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px 20px 28px;
        }

        .board-shell{
            width:100%;
            max-width:1200px;
            height:540px;
            border-radius:24px;
            background:transparent;
            border: none;
            box-shadow: none;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            position:relative;
        }

        .board-header{
            position:fixed;
            left:18px;
            top:18px;
            display:flex;
            align-items:center;
            gap:10px;
            z-index:30;
            padding:6px 8px;
            background:transparent;
        }

        .board-header .logo-img{ width:38px; height:38px; object-fit:contain }

        .board-header h2{
            font-family: 'Outfit', 'Source Sans Pro', sans-serif;
            font-weight:700;
            letter-spacing:1px;
            margin:0;
            font-size:28px;
            color:#0f172a;
            line-height:1;
        }

        .board-body{
            flex:1 1 auto;
            display:flex;
            align-items:center;
            justify-content:center;
            flex-direction:column;
            gap:18px;
            color:#334155;
            background:transparent;
        }

        .board-grid{
            width:100%;
            height:100%;
            display:grid;
            grid-template-columns:repeat(auto-fill, 220px);
            align-content:start;
            justify-content:start;
            gap:18px;
            padding:92px 0 28px;
            overflow:auto;
            box-sizing:border-box;
        }

        .boards-heading{
            grid-column:1 / -1;
            justify-self:center;
            font-family:'Poppins', 'Outfit', sans-serif;
            font-size:28px;
            font-weight:700;
            color:#111827;
            margin:0 0 14px;
        }

        .board-card{
            background:transparent;
            border:0;
            border-radius:14px;
            box-shadow:none;
            width:220px;
            height:220px;
            padding:0;
            position:relative;
            display:flex;
            flex-direction:column;
            justify-content:flex-start;
            cursor:pointer;
            transition:transform .2s ease, filter .2s ease;
        }

        .board-card-preview{
            width:100%;
            height:100%;
            background:var(--board-background, #2f5be3);
            border-radius:14px;
            clip-path:polygon(0 12%, 34% 12%, 42% 0, 72% 0, 78% 12%, 100% 12%, 100% 100%, 0 100%);
            transition:transform .2s ease, background-color .2s ease;
        }

        .has-boards .board-card-preview{
            transform-origin:center;
        }

        .has-boards .overlay-create{
            position:fixed;
            right:28px;
            bottom:28px;
            z-index:40;
        }

        .has-boards .graphic-overlay{
            display:block !important;
            bottom:0;
        }

        .has-boards .graphic-overlay .overlay-title{
            display:none;
        }

        .board-card:hover{
            transform:translateY(-6px);
            filter:drop-shadow(0 12px 12px rgba(15,23,42,0.15));
        }

        .board-card-name{
            position:absolute;
            top:22px;
            left:18px;
            right:18px;
            z-index:2;
            font-family:'Poppins', 'Outfit', sans-serif;
            font-size:19px;
            font-weight:700;
            color:#ffffff;
            margin:0;
            line-height:1.2;
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
        }

        .board-card-date{
            position:absolute;
            top:52px;
            left:18px;
            right:18px;
            z-index:2;
            font-family:'Poppins', 'Outfit', sans-serif;
            font-size:12px;
            color:rgba(255,255,255,0.86);
            margin:0;
        }

        .board-card:hover .board-card-preview{
            transform:scale(1.03);
        }

        .empty-title{
            font-size:20px;
            color:#0f172a;
            font-weight:600;
        }

        .create-main{
            appearance:none;
            border:2px dashed #9ca3af;
            background:transparent;
            padding:28px 36px;
            border-radius:18px;
            cursor:pointer;
            color:#374151;
            font-weight:600;
            display:flex;
            align-items:center;
            gap:12px;
        }

        .create-main img{ width:58px; opacity:0.9 }

        /* graphic bottom center (visible, fixed to viewport) */
        .graphic{
            position:fixed;
            bottom:10px;
            left:50%;
            transform:translateX(-50%);
            pointer-events:none;
            width:80vw;
            max-width:none;
            height:auto;
            opacity:1;
            z-index:10;
        }

        /* Overlay heading displayed on top of the graphic */
        .graphic-overlay{
            position:fixed;
            left:50%;
            transform:translateX(-50%);
            /* moved lower so it's closer to the graphic */
            bottom:400px;
            pointer-events:none;
            z-index:11;
            text-align:center;
            width:100%;
        }

        .graphic-overlay .overlay-title{
            font-family: 'Outfit', 'Source Sans Pro', sans-serif;
            font-size:36px;
            font-weight:700;
            margin:0;
            color:#000; /* plain black as requested */
        }

        .graphic-overlay .overlay-actions{
            margin-top:18px;
        }

        /* circular floating plus button */
        .overlay-create{
            pointer-events:auto; /* allow clicking */
            width:50px;
            height:50px;
            padding:0;
            border-radius:50%;
            border:none;
            overflow:hidden;
            /* solid blue from provided image */
            background:#0052cc;
            display:inline-grid;
            place-items:center;
            color:#fff;
            cursor:pointer;
            box-shadow:0 14px 34px rgba(0,82,204,0.16), 0 6px 18px rgba(0,0,0,0.08);
            transform:translateY(0);
            transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
        }

        .overlay-create .plus{
            font-size:20px;
            line-height:1;
            font-weight:800;
            display:inline-block;
            transform:translateY(-2px);
            letter-spacing:-2px;
        }

        .overlay-create:hover{
            transform:translateY(-6px) scale(1.03);
            box-shadow:0 30px 60px rgba(0,82,204,0.22), 0 12px 30px rgba(0,0,0,0.12);
            filter:brightness(1.02);
        }

        .overlay-create:active{
            transform:translateY(-2px) scale(.98);
        }

        /* fun modal styling */
        .modal-backdrop{
            position:fixed;inset:0;background:rgba(15,23,42,0.42);display:none;align-items:center;justify-content:center;z-index:60;
            backdrop-filter:blur(2px);
            opacity:0;
            transition:opacity .2s ease;
        }

        .modal-backdrop.visible{
            display:flex;
            opacity:1;
        }

        .modal{
            background:#f3f1f8;
            padding:0 18px 16px;
            border-radius:22px;
            width:min(420px, calc(100vw - 24px));
            box-shadow:0 20px 60px rgba(15, 23, 42, 0.12);
            border:3px solid rgba(50, 50, 70, 0.08);
            overflow:hidden;
            max-height:78vh;
            transform:translateY(8px) scale(.98);
            transition:transform .2s ease, opacity .2s ease;
            position:relative;
        }

        .modal-backdrop.visible .modal{
            transform:translateY(0) scale(1);
        }

        .modal-top-tabs{
            display:flex;
            gap:10px;
            background:rgba(255,255,255,0.45);
            padding:8px;
            border-radius:999px;
            margin:16px auto 12px;
            border:1px solid rgba(148, 163, 184, 0.2);
        }

        .modal-tab{
            flex:1;
            border:none;
            border-radius:999px;
            background:transparent;
            color:#1f2937;
            font-weight:700;
            font-size:14px;
            padding:10px 14px;
            cursor:pointer;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            transition:background .2s ease, color .2s ease, transform .2s ease;
        }

        .modal-tab.active{
            background:#2563eb;
            color:white;
            box-shadow:0 10px 18px rgba(37,99,235,0.22);
        }

        .modal-hero{
            display:block;
            width:100%;
            max-width:380px;
            margin:0 auto 6px;
            height:170px;
            object-fit:contain;
            object-position:center;
            border-radius:0;
            background:transparent;
        }

        .modal-header{
            margin-bottom:10px;
            padding-right:40px;
        }

        .modal h3{
            margin:0;
            color:#1b1a2d;
            font-family: 'Poppins', 'Outfit', sans-serif;
            font-size:28px;
            font-weight:800;
            letter-spacing:-0.05em;
            line-height:1.1;
        }

        .modal-subtitle{
            margin:6px 0 0;
            color:#6b7280;
            font-family:'Poppins', 'Source Sans Pro', sans-serif;
            font-size:14px;
            font-weight:500;
        }

        .modal .row{margin-bottom:14px}

        .modal label{
            display:block;
            font-size:15px;
            color:#1f2430;
            margin-bottom:8px;
            font-family:'Poppins', 'Outfit', sans-serif;
            font-weight:600;
            letter-spacing:-0.02em;
        }

        .modal input[type="text"]{
            width:100%;
            padding:12px 14px;
            border:1px solid #dfe4ee;
            border-radius:12px;
            background:#f9f9fb;
            box-shadow:inset 0 1px 0 rgba(255,255,255,0.8);
            font-family:'Poppins', 'Source Sans Pro', sans-serif;
            font-size:15px;
            color:#1f2937;
            transition:border-color .2s ease, box-shadow .2s ease, background .2s ease;
        }

        .modal input[type="text"]::placeholder{color:#94a3b8}

        .modal input[type="text"]:focus{
            outline:none;
            border-color:rgba(124,58,237,0.6);
            box-shadow:0 0 0 4px rgba(124,58,237,0.12), inset 0 1px 0 rgba(255,255,255,0.8);
            background:#fff;
        }

        .modal .options{display:flex;gap:8px;flex-wrap:wrap}

        .option-btn{
            position:relative;
            display:flex;
            align-items:center;
            gap:8px;
            padding:10px 12px;
            border-radius:12px;
            border:1px solid #dfe3ed;
            background:#f8f8fb;
            cursor:pointer;
            font-family:'Poppins', 'Outfit', sans-serif;
            font-size:15px;
            font-weight:600;
            color:#3b3d4d;
            transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
        }

        .option-btn:hover{
            transform:translateY(-1px);
            box-shadow:0 8px 16px rgba(15,23,42,0.06);
        }

        .option-btn:focus-visible{
            outline:none;
            box-shadow:0 0 0 3px rgba(37,99,235,0.12);
        }

        .option-btn.active{
            background:transparent;
            color:#1f2937;
            border-color:#dfe3ed;
            box-shadow:none;
        }

        .option-preview{
            width:18px;
            height:18px;
            border-radius:5px;
            border:1.5px solid #cbd5e1;
            background:#fff;
            position:relative;
            flex-shrink:0;
            display:inline-flex;
            align-items:center;
            justify-content:center;
        }

        .option-check{
            display:none;
            font-size:12px;
            font-weight:800;
            line-height:1;
            color:#fff;
        }

        .option-btn.active .option-preview{
            background:#2563eb;
            border-color:#2563eb;
        }

        .option-btn.active .option-check{
            display:inline-block;
        }

        .modal .actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px}

        .modal .actions .left-note{font-size:12px;color:#6b7280}

        .btn{padding:11px 18px;border-radius:12px;border:none;cursor:pointer;font-family:'Poppins', 'Outfit', sans-serif;font-weight:700;font-size:16px;transition:all .18s ease}

        .btn.primary{background:#2563eb;color:#fff;box-shadow:0 12px 30px rgba(37,99,235,0.25)}
        .btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 16px 36px rgba(37,99,235,0.32)}
        .btn.primary:active:not(:disabled){transform:translateY(0)}
        .btn.primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}

        .btn.ghost{background:transparent;border:1px solid #dfe3ed;color:#2f3440}
        .btn.ghost:hover{background:#fff;transform:translateY(-1px)}

        @media(max-width:640px){
            .board-shell{height:500px;padding:12px}
            .modal{width:min(92vw, 420px);padding:0 14px 14px}
            .modal-hero{height:150px;max-width:320px}
            .modal h3{font-size:24px}
            .option-btn{flex:1 1 calc(50% - 8px);justify-content:center}
            .modal .actions{gap:10px}
            .btn{flex:1}
            .board-header h2{font-size:24px}
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="board-shell" role="main">
            <div class="board-header">
                <img src="assets/logo.png" alt="LiveCanvas" class="logo-img">
                <h2 style="margin:0">Live Canvas</h2>
            </div>

            <div id="boardBody" class="board-body">
                <div id="boardList" class="board-grid" hidden></div>
            </div>

            <img id="emptyGraphic" src="assets/saved.png" alt="saved graphic" class="graphic">

            <div id="emptyOverlay" class="graphic-overlay">
                <h1 class="overlay-title">You have no boards</h1>
                <h1 class="overlay-title">Create your first one now</h1>
                <div class="overlay-actions">
                    <button id="openCreate" class="overlay-create" aria-label="Create new board"><span class="plus">+</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="backdrop" class="modal-backdrop">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <div class="modal-top-tabs" aria-label="Create or join board options">
                <button type="button" class="modal-tab active" data-mode="create">Create</button>
                <button type="button" class="modal-tab" data-mode="join">Join</button>
            </div>
            <img id="modalHeroImage" src="assets/popup.png" alt="Create board illustration" class="modal-hero">
            <div class="modal-header">
                <h3 id="modalTitle">Create New Board</h3>
            </div>
            <div class="row" id="boardNameRow">
                <label id="boardNameLabel" for="boardName">Board name</label>
                <input id="boardName" type="text" placeholder="e.g. Project Ideas" autocomplete="off">
            </div>
            <div class="row" id="styleRow">
                <label>Canvas style</label>
                <div class="options" id="options" role="radiogroup" aria-label="Canvas style options">
                    <button type="button" class="option-btn" data-value="grid" aria-pressed="false">
                        <span class="option-preview" aria-hidden="true"><span class="option-check">✓</span></span>
                        <span>Grid</span>
                    </button>
                    <button type="button" class="option-btn" data-value="dots" aria-pressed="false">
                        <span class="option-preview" aria-hidden="true"><span class="option-check">✓</span></span>
                        <span>Dots</span>
                    </button>
                    <button type="button" class="option-btn" data-value="blank" aria-pressed="true">
                        <span class="option-preview" aria-hidden="true"><span class="option-check">✓</span></span>
                        <span>Blank</span>
                    </button>
                    <button type="button" class="option-btn" data-value="lines" aria-pressed="false">
                        <span class="option-preview" aria-hidden="true"><span class="option-check">✓</span></span>
                        <span>Lines</span>
                    </button>
                </div>
            </div>
            <div class="actions">
                <button id="cancelBtn" class="btn ghost" type="button">Cancel</button>
                <button id="createBtn" class="btn primary" type="button" disabled>Create board</button>
            </div>
        </div>
    </div>

    <script>
        // Require login
        try{
            const user = JSON.parse(localStorage.getItem('loggedInUser'));
            if(!user){
                window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
            }
        }catch(e){
            window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        }

        const backdrop = document.getElementById('backdrop');
        const openCreate = document.getElementById('openCreate');
        const cancelBtn = document.getElementById('cancelBtn');
        const createBtn = document.getElementById('createBtn');
        const optionsEl = document.getElementById('options');
        const boardNameInput = document.getElementById('boardName');
        const boardNameLabel = document.getElementById('boardNameLabel');
        const boardNameRow = document.getElementById('boardNameRow');
        const styleRow = document.getElementById('styleRow');
        const boardList = document.getElementById('boardList');
        const emptyGraphic = document.getElementById('emptyGraphic');
        const emptyOverlay = document.getElementById('emptyOverlay');
        const modalTabs = document.querySelectorAll('.modal-tab');
        const modalTitle = document.getElementById('modalTitle');
        const modalHeroImage = document.getElementById('modalHeroImage');

        let selectedOption = 'grid';

        const boardColorPairs = [
            { background: '#2f5be3', accent: '#ff646b' },
            { background: '#168f8b', accent: '#ffcf56' },
            { background: '#7b3fc6', accent: '#62d7c5' },
            { background: '#e85d3f', accent: '#4a62d8' },
            { background: '#246b52', accent: '#f78da7' }
        ];

        function formatBoardDate(value) {
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) {
                return 'Recently';
            }
            return date.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function createBoardId(existingBoards) {
            const alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let boardId = '';

            do {
                boardId = Array.from({ length: 8 }, () =>
                    alphabet[Math.floor(Math.random() * alphabet.length)]
                ).join('');
            } while (existingBoards.some(board => board.id === boardId));

            return boardId;
        }

        function renderBoardList() {
            const boards = JSON.parse(localStorage.getItem('savedBoards') || '[]');
            const hasBoards = Array.isArray(boards) && boards.length > 0;

            if (hasBoards) {
                document.querySelector('.board-shell').classList.add('has-boards');
                boardList.hidden = false;
                boardList.innerHTML = boards.map((board, index) => {
                    const colors = boardColorPairs[index % boardColorPairs.length];
                    return `
                    <div class="board-card" style="--board-background:${colors.background};--board-accent:${colors.accent}" data-board-id="${board.id || ''}" data-board-name="${(board.name || 'Untitled').replace(/"/g, '&quot;')}">
                        <h3 class="board-card-name">${(board.name || 'Untitled').replace(/</g, '&lt;').replace(/>/g, '&gt;')}</h3>
                        <div class="board-card-date">${formatBoardDate(board.created || Date.now())}</div>
                        <div class="board-card-preview"></div>
                    </div>
                `;
                }).join('');

                boardList.insertAdjacentHTML('afterbegin', '<h2 class="boards-heading">Your Boards</h2>');

                boardList.querySelectorAll('.board-card').forEach(card => {
                    card.addEventListener('click', () => {
                        const boardId = card.getAttribute('data-board-id');
                        const boardName = card.getAttribute('data-board-name');
                        if (!boardId) return;
                        sessionStorage.setItem('currentBoardId', boardId);
                        sessionStorage.setItem('currentBoardName', boardName);
                        window.location.href = `index.html?board=${encodeURIComponent(boardId)}`;
                    });
                });

                emptyGraphic.style.display = 'none';
                emptyOverlay.style.display = 'block';
                return;
            }

            boardList.hidden = true;
            boardList.innerHTML = '';
            document.querySelector('.board-shell').classList.remove('has-boards');
            emptyGraphic.style.display = 'block';
            emptyOverlay.style.display = 'block';
        }

        function updateCreateButtonState(){
            const hasValue = boardNameInput.value.trim().length > 0;
            createBtn.disabled = !hasValue;
        }

        function openModal(){
            backdrop.classList.add('visible');
            setTimeout(() => {
                boardNameInput.focus();
                boardNameInput.setSelectionRange(boardNameInput.value.length, boardNameInput.value.length);
            }, 50);
        }

        function setActiveTab(mode){
            modalTabs.forEach(tab => {
                const active = tab.dataset.mode === mode;
                tab.classList.toggle('active', active);
            });

            const isJoin = mode === 'join';
            modalTitle.textContent = isJoin ? 'Join Board' : 'Create New Board';
            createBtn.textContent = isJoin ? 'Join board' : 'Create board';
            boardNameLabel.textContent = isJoin ? 'Enter the code' : 'Board name';
            boardNameInput.placeholder = isJoin ? 'Enter the code' : 'e.g. Project Ideas';
            styleRow.style.display = isJoin ? 'none' : 'block';
            if (modalHeroImage) {
                modalHeroImage.src = isJoin ? 'assets/join.png' : 'assets/popup.png';
                modalHeroImage.alt = isJoin ? 'Join board illustration' : 'Create board illustration';
            }
            if (isJoin) {
                boardNameInput.value = '';
            }
            updateCreateButtonState();
        }

        function closeModal(){
            backdrop.classList.remove('visible');
            boardNameInput.value = '';
            updateCreateButtonState();
            selectedOption = 'grid';
            Array.from(optionsEl.children).forEach(btn => {
                btn.classList.remove('active');
                btn.setAttribute('aria-pressed', 'false');
            });
            const gridOption = optionsEl.querySelector('[data-value="grid"]');
            if (gridOption) {
                gridOption.classList.add('active');
                gridOption.setAttribute('aria-pressed', 'true');
            }
            setActiveTab('create');
        }

        modalTabs.forEach(tab => {
            tab.addEventListener('click', () => setActiveTab(tab.dataset.mode));
        });

        if (openCreate) openCreate.addEventListener('click', openModal);
        cancelBtn.addEventListener('click', closeModal);
        backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) closeModal(); });

        document.addEventListener('keydown', (e)=>{
            if (!backdrop.classList.contains('visible')) return;
            if (e.key === 'Escape') closeModal();
            if (e.key === 'Enter' && !createBtn.disabled) {
                createBtn.click();
            }
        });

        boardNameInput.addEventListener('input', updateCreateButtonState);

        setActiveTab('create');

        // options handler
        optionsEl.addEventListener('click', (e)=>{
            const btn = e.target.closest('.option-btn');
            if(!btn) return;
            selectedOption = btn.dataset.value;
            Array.from(optionsEl.children).forEach(b => {
                const isActive = b === btn;
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-pressed', String(isActive));
            });
        });

        const gridOption = optionsEl.querySelector('[data-value="grid"]');
        if (gridOption) {
            gridOption.classList.add('active');
            gridOption.setAttribute('aria-pressed', 'true');
        }

        renderBoardList();
        updateCreateButtonState();

        createBtn.addEventListener('click', ()=>{
            const name = boardNameInput.value.trim();
            if (!name) return;

            const boards = JSON.parse(localStorage.getItem('savedBoards') || '[]');
            const isJoinMode = document.querySelector('.modal-tab.active')?.dataset.mode === 'join';

            if (isJoinMode) {
                const boardId = name.replace(/[^a-z0-9]/gi, '').toUpperCase();
                if (!boardId) return;
                const existing = boards.find(board => String(board.id || '').toUpperCase() === boardId);
                const joinedBoard = existing || {
                    id: boardId,
                    name: boardId,
                    template: selectedOption,
                    canvasStyle: selectedOption === 'blank' ? 'blank' : selectedOption,
                    created: Date.now()
                };

                if (!existing) {
                    boards.unshift(joinedBoard);
                    localStorage.setItem('savedBoards', JSON.stringify(boards));
                }

                sessionStorage.setItem('currentBoardId', boardId);
                sessionStorage.setItem('currentCanvasStyle', selectedOption);
                sessionStorage.setItem('currentBoardName', joinedBoard.name || boardId);
                closeModal();
                renderBoardList();
                return;
            }

            const id = createBoardId(boards);
            const board = {
                id,
                name,
                template: selectedOption,
                canvasStyle: selectedOption === 'blank' ? 'blank' : selectedOption,
                created: Date.now()
            };
            boards.unshift(board);
            localStorage.setItem('savedBoards', JSON.stringify(boards));

            sessionStorage.setItem('currentBoardId', id);
            sessionStorage.setItem('currentCanvasStyle', selectedOption);
            sessionStorage.setItem('currentBoardName', name);
            closeModal();
            renderBoardList();

            const newBoardCard = boardList.querySelector(`[data-board-id="${id}"]`);
            newBoardCard?.focus();
        });
    </script>

</body>

</html>
