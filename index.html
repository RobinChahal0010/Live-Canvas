<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LiveCanvas</title>

    <script>
        if (!new URLSearchParams(window.location.search).has("board")) {
            window.location.replace("home.html");
        }
    </script>

    <link
        rel="icon"
        type="image/png"
        href="assets/icon.png">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css">

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <!-- LOGO -->

    <div class="logo">

        <img
            src="assets/logo_bg.png"
            alt="LiveCanvas"
            class="logo-img">

        <h2>LiveCanvas</h2>

    </div>


    <!-- HEADER RIGHT -->

    <div class="header-right">

        <div class="auth-section">

            <span id="welcomeUser"></span>

            <button id="loginHeaderBtn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>


            <button id="signupHeaderBtn">

                <i class="fa-solid fa-user-plus"></i>

                Signup

            </button>


            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         CANVAS SECTION
    ================================================== -->

    <section class="canvas-section">


        <!-- =================================================
             CANVAS TOP BAR
        ================================================== -->

        <div class="canvas-topbar">


            <!-- DOCUMENT INFO -->

            <div class="document-info">

                <span class="document-icon">

                    <i class="fa-solid fa-book-open"></i>

                </span>


                <div>

                    <input
                        type="text"
                        id="documentTitle"
                        value=""
                        placeholder="Board name">

                    <small>
                        LiveCanvas Document
                    </small>

                </div>

            </div>

<div class="collaborators" id="collaborators">

    <div
        class="collaborator-list"
        id="collaboratorList">
    </div>

    <button
        class="share-btn"
        id="shareBtn"
        type="button">

        
        Share

    </button>

    <button
        class="board-code-btn"
        id="boardCodeBtn"
        type="button"
        title="Copy board code">
        Code: <span id="boardCode">-</span>
    </button>

</div>

            


                

        </div>



        <!-- =================================================
             CANVAS TOOLBAR
        ================================================== -->

        <div class="canvas-toolbar">


            <!-- SELECT -->

            <button
                class="tool active-tool"
                id="selectTool"
                title="Select">

                <i class="fa-solid fa-arrow-pointer"></i>

            </button>



            <!-- PEN -->

            <button
                class="tool"
                id="drawBtn"
                title="Pen">

                <i class="fa-solid fa-pen"></i>

            </button>



            <!-- HIGHLIGHTER -->

            <button
                class="tool"
                id="highlighterBtn"
                title="Highlighter">

                <i class="fa-solid fa-highlighter"></i>

            </button>



            <!-- LIGHT PEN -->

            <button
                class="tool"
                id="lightPenBtn"
                title="Light Pen">

                <i class="fa-solid fa-wand-magic-sparkles"></i>

            </button>



            <!-- ERASER -->

            <button
                class="tool"
                id="eraserBtn"
                title="Eraser">

                <i class="fa-solid fa-eraser"></i>

            </button>



            <div class="toolbar-divider"></div>



            <!-- SHAPE MODAL -->
             <button
    class="tool"
    id="shapeBtn"
    title="Shapes">

    <i class="fa-regular fa-square"></i>

</button>

<div id="shapePicker" class="shape-modal">

    <div class="shape-modal-header">
        <span>Shapes</span>

        <button id="closeShapePicker">
            ✕
        </button>
    </div>

    <div class="shape-grid">

        <button class="shape-option" data-shape="rectangle">
            <span>▭</span>
            <small>Rectangle</small>
        </button>

        <button class="shape-option" data-shape="circle">
            <span>○</span>
            <small>Circle</small>
        </button>

        <button class="shape-option" data-shape="triangle">
            <span>△</span>
            <small>Triangle</small>
        </button>

        <button class="shape-option" data-shape="diamond">
            <span>◇</span>
            <small>Diamond</small>
        </button>

        <button class="shape-option" data-shape="line">
            <span>╱</span>
            <small>Line</small>
        </button>

        <button class="shape-option" data-shape="arrow">
            <span>→</span>
            <small>Arrow</small>
        </button>

        <button class="shape-option" data-shape="star">
            <span>★</span>
            <small>Star</small>
        </button>

        <button class="shape-option" data-shape="hexagon">
            <span>⬡</span>
            <small>Hexagon</small>
        </button>

        <button class="shape-option" data-shape="pentagon">
            <span>⬠</span>
            <small>Pentagon</small>
        </button>

        <button class="shape-option" data-shape="parallelogram">
            <span>▱</span>
            <small>Parallelogram</small>
        </button>

        <button class="shape-option" data-shape="cloud">
            <span>☁</span>
            <small>Cloud</small>
        </button>

        <button class="shape-option" data-shape="heart">
            <span>♥</span>
            <small>Heart</small>
        </button>

    </div>

</div>



            <!-- TEXT -->

            <button
                class="tool"
                id="textBtn"
                title="Text">

                <i class="fa-solid fa-t"></i>

            </button>



            <!-- IMAGE -->

            <button
                class="tool"
                id="imageBtn"
                title="Image">

                <i class="fa-regular fa-image"></i>

            </button>



            <!-- TABLE -->

            <button
                class="tool"
                id="tableBtn"
                title="Table">

                <i class="fa-solid fa-table"></i>

            </button>



            <div class="toolbar-divider"></div>



            <!-- COLOR -->

            <label
                class="color-tool"
                title="Color">

                <input
                    type="color"
                    id="colorPicker"
                    value="#172033">

            </label>



            <!-- BRUSH SIZE -->

            <input
                type="range"
                id="brushSize"
                min="1"
                max="20"
                value="4"
                class="brush-slider">



            <div class="toolbar-spacer"></div>



            <!-- UNDO -->

            <button
                class="tool"
                id="undoBtn"
                title="Undo">

                <i class="fa-solid fa-rotate-left"></i>

            </button>



            <!-- REDO -->

            <button
                class="tool"
                id="redoBtn"
                title="Redo">

                <i class="fa-solid fa-rotate-right"></i>

            </button>



            <div class="toolbar-divider"></div>



            <!-- ZOOM OUT -->

            <button
                class="tool"
                id="zoomOut"
                title="Zoom Out">

                <i class="fa-solid fa-minus"></i>

            </button>


            <span id="zoomValue">
                100%
            </span>


            <!-- ZOOM IN -->

            <button
                class="tool"
                id="zoomIn"
                title="Zoom In">

                <i class="fa-solid fa-plus"></i>

            </button>

        </div>



        <!-- =================================================
             NOTEBOOK AREA
        ================================================== -->

        <div class="notebook-area">


            <!-- NOTEBOOK PAGE -->

            <div
                class="notebook-page"
                id="notebookPage"
                data-canvas-style="blank">

                <div id="canvasPointers" aria-hidden="true"></div>
                <div id="localCanvasPointer" class="canvas-pointer local-canvas-pointer" aria-hidden="true"></div>


                <!-- PAPER BACKGROUND -->

                <div class="paper-background"></div>



                <!-- DRAWING CANVAS -->

                <canvas
                    id="drawingBoard"
                    width="1000"
                    height="700">
                </canvas>



                <!-- OBJECT LAYER -->

                <div
                    class="object-layer"
                    id="objectLayer">
                </div>

            </div>



            <!-- =================================================
                 PAGE CONTROLS
            ================================================== -->

            <div class="page-controls">


                <!-- PREVIOUS -->

                <button
                    class="page-btn"
                    id="previousPage">

                    <i class="fa-solid fa-chevron-left"></i>

                </button>



                <!-- PAGE NUMBER -->

                <span id="pageNumber">
                    1 / ∞
                </span>



                <!-- NEXT -->

                <button
                    class="page-btn"
                    id="nextPage">

                    <i class="fa-solid fa-chevron-right"></i>

                </button>

            </div>



            <!-- =================================================
                 ADD PAGE
            ================================================== -->

            <button
                class="add-page-btn"
                id="addPageBtn">

                <i class="fa-solid fa-plus"></i>

                Add Page

            </button>



            <!-- =================================================
                 EXTEND PAGE
            ================================================== -->

            <button
                class="extend-page-btn"
                id="extendPageBtn">

                <i class="fa-solid fa-arrows-up-down"></i>

                Extend Page

            </button>

        </div>

    </section>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <p>

        Made with ❤️ using
        HTML,
        CSS &
        JavaScript

    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="http://127.0.0.1:3000/socket.io/socket.io.js"></script>

<script src="script.js"></script>


</body>

</html>
