<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>LiveCanvas</title>

    <script>
        if (!new URLSearchParams(window.location.search).has("board")) {
            window.location.replace("home.html");
        }
    </script>

    <link
        rel="icon"
        type="image/png"
        href="assets/icon.png">

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="style.css">

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <!-- LOGO -->

    <div class="logo">

        <img
            src="assets/logo_bg.png"
            alt="LiveCanvas"
            class="logo-img">

        <h2>LiveCanvas</h2>

    </div>


    <!-- HEADER RIGHT -->

    <div class="header-right">

        <div class="auth-section">

            <!-- User Avatar & Dropdown -->
            <div class="user-avatar-wrap" id="userAvatarBtn" title="Account" style="display: none;">
                <div class="user-avatar-ring"></div>
                <div class="user-avatar">
                    <img id="userProfileImg" src="assets/profile/1.png" alt="Profile">
                </div>
                <div class="user-menu-dropdown" id="userMenuDropdown">
                    <div class="user-menu-header">
                        <p class="user-menu-name" id="userMenuName">User</p>
                        <p class="user-menu-email" id="userMenuEmail"></p>
                    </div>
                    <div class="user-menu-divider"></div>
                    <a href="saved.html" class="user-menu-item">
                        <i class="fa-solid fa-folder-open"></i>
                        <span>Saved Canvases</span>
                    </a>
                    <div class="user-menu-divider"></div>
                    <button class="user-menu-item user-menu-logout" id="dropdownLogoutBtn" type="button">
                        <i class="fa-solid fa-right-from-bracket"></i>
                        <span>Log out</span>
                    </button>
                </div>
            </div>

            <button id="loginHeaderBtn" type="button">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login
            </button>

            <button id="signupHeaderBtn" type="button">
                <i class="fa-solid fa-user-plus"></i>
                Signup
            </button>

            <button id="logoutBtn" type="button" style="display: none;">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>

        </div>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         CANVAS SECTION
    ================================================== -->

    <section class="canvas-section">


        <!-- =================================================
             CANVAS TOP BAR
        ================================================== -->

        <div class="canvas-topbar">


            <!-- DOCUMENT INFO -->
            <div class="document-info">
                <input
                    type="text"
                    id="documentTitle"
                    value=""
                    placeholder="Board name">
            </div>

<div class="collaborators" id="collaborators">

    <div
        class="collaborator-list"
        id="collaboratorList">
    </div>

    <button
        class="share-btn"
        id="shareBtn"
        type="button">

        
        Share

    </button>

    <button
        class="board-code-btn"
        id="boardCodeBtn"
        type="button"
        title="Copy board code">
        Code: <span id="boardCode">-</span>
    </button>

</div>

            


                

        </div>



        <!-- =================================================
             CANVAS TOOLBAR
        ================================================== -->

        <div class="canvas-toolbar">


            <!-- SELECT -->

            <button
                class="tool active-tool"
                id="selectTool"
                title="Select">

                <i class="fa-solid fa-arrow-pointer"></i>

            </button>



            <!-- PEN -->

            <button
                class="tool"
                id="drawBtn"
                title="Pen">

                <i class="fa-solid fa-pen"></i>

            </button>



            <!-- HIGHLIGHTER -->

            <button
                class="tool"
                id="highlighterBtn"
                title="Highlighter">

                <i class="fa-solid fa-highlighter"></i>

            </button>



            <!-- LIGHT PEN -->

            <button
                class="tool"
                id="lightPenBtn"
                title="Light Pen">

                <i class="fa-solid fa-wand-magic-sparkles"></i>

            </button>



            <!-- ERASER -->

            <button
                class="tool"
                id="eraserBtn"
                title="Eraser">

                <i class="fa-solid fa-eraser"></i>

            </button>



            <div class="toolbar-divider"></div>



            <!-- SHAPE MODAL -->
             <button
    class="tool"
    id="shapeBtn"
    title="Shapes">

    <i class="fa-regular fa-square"></i>

</button>

<div id="shapePicker" class="shape-modal">

    <div class="shape-modal-header">
        <span>Shapes</span>

        <button id="closeShapePicker">
            ✕
        </button>
    </div>

    <div class="shape-grid">

        <button class="shape-option" data-shape="square">
            <span>□</span>
            <small>Square</small>
        </button>

        <button class="shape-option" data-shape="rectangle">
            <span>▭</span>
            <small>Rectangle</small>
        </button>

        <button class="shape-option" data-shape="circle">
            <span>○</span>
            <small>Circle</small>
        </button>

        <button class="shape-option" data-shape="triangle">
            <span>△</span>
            <small>Triangle</small>
        </button>

        <button class="shape-option" data-shape="diamond">
            <span>◇</span>
            <small>Diamond</small>
        </button>

        <button class="shape-option" data-shape="line">
            <span>╱</span>
            <small>Line</small>
        </button>

        <button class="shape-option" data-shape="arrow">
            <span>→</span>
            <small>Arrow</small>
        </button>

        <button class="shape-option" data-shape="star">
            <span>★</span>
            <small>Star</small>
        </button>

        <button class="shape-option" data-shape="hexagon">
            <span>⬡</span>
            <small>Hexagon</small>
        </button>

        <button class="shape-option" data-shape="pentagon">
            <span>⬠</span>
            <small>Pentagon</small>
        </button>

        <button class="shape-option" data-shape="parallelogram">
            <span>▱</span>
            <small>Parallelogram</small>
        </button>

        <button class="shape-option" data-shape="cloud">
            <span>☁</span>
            <small>Cloud</small>
        </button>

        <button class="shape-option" data-shape="heart">
            <span>♥</span>
            <small>Heart</small>
        </button>

    </div>

</div>



            <!-- TEXT -->

            <button
                class="tool"
                id="textBtn"
                title="Text">

                <i class="fa-solid fa-t"></i>

            </button>

            <button
                class="tool"
                id="stickyBtn"
                title="Sticky note"
                type="button">

                <i class="fa-solid fa-note-sticky"></i>

            </button>



            <!-- IMAGE -->

            <button
                class="tool"
                id="imageBtn"
                title="Image">

                <i class="fa-regular fa-image"></i>

            </button>



            <!-- TABLE -->

            <button
                class="tool"
                id="tableBtn"
                title="Table">

                <i class="fa-solid fa-table"></i>

            </button>



            <div class="toolbar-divider"></div>



            <!-- COLOR -->

            <label
                class="color-tool"
                title="Color">

                <input
                    type="color"
                    id="colorPicker"
                    value="#172033">

            </label>



            <!-- BRUSH SIZE -->

            <input
                type="range"
                id="brushSize"
                min="1"
                max="20"
                value="4"
                class="brush-slider">



            <div class="toolbar-spacer"></div>

        </div>



        <!-- =================================================
             NOTEBOOK AREA
        ================================================== -->

        <div class="notebook-area">


            <!-- NOTEBOOK PAGE -->

            <div
                class="notebook-page"
                id="notebookPage"
                data-canvas-style="blank">

                <div id="canvasPointers" aria-hidden="true"></div>
                <div id="localCanvasPointer" class="canvas-pointer local-canvas-pointer" aria-hidden="true"></div>


                <!-- PAPER BACKGROUND -->

                <div class="paper-background"></div>



                <!-- DRAWING CANVAS -->

                <canvas
                    id="drawingBoard"
                    width="1000"
                    height="700">
                </canvas>



                <!-- OBJECT LAYER -->

                <div
                    class="object-layer"
                    id="objectLayer">
                </div>

            </div>



        </div>

        <!-- Canvas navigation is deliberately outside the tool rail so it
             remains visible as a bottom-right control dock. -->
        <div class="canvas-navigation" aria-label="Canvas navigation controls">
            <button class="tool" id="undoBtn" title="Undo" type="button">
                <i class="fa-solid fa-rotate-left"></i>
            </button>
            <button class="tool" id="redoBtn" title="Redo" type="button">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
            <span class="navigation-divider" aria-hidden="true"></span>
            <button class="tool" id="zoomOut" title="Zoom Out" type="button">
                <i class="fa-solid fa-minus"></i>
            </button>
            <span id="zoomValue">100%</span>
            <button class="tool" id="zoomIn" title="Zoom In" type="button">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div id="toolSettingsPopover" class="tool-settings-popover" aria-hidden="true">
            <div class="tool-settings-heading" id="toolSettingsTitle">Pen settings</div>
            <div class="tool-colors" id="toolColorOptions" aria-label="Stroke color">
                <button type="button" data-color="#172033" style="--swatch:#172033" aria-label="Black"></button>
                <button type="button" data-color="#ef4444" style="--swatch:#ef4444" aria-label="Red"></button>
                <button type="button" data-color="#f59e0b" style="--swatch:#f59e0b" aria-label="Orange"></button>
                <button type="button" data-color="#22c55e" style="--swatch:#22c55e" aria-label="Green"></button>
                <button type="button" data-color="#3b82f6" style="--swatch:#3b82f6" aria-label="Blue"></button>
                <button type="button" data-color="#8b5cf6" style="--swatch:#8b5cf6" aria-label="Purple"></button>
                <label class="tool-custom-color" title="Custom color"><input id="toolColorInput" type="color" value="#172033"></label>
            </div>
            <label class="tool-width-control">
                <span>Width</span>
                <input id="toolWidthInput" type="range" min="1" max="20" value="4">
                <output id="toolWidthValue">4</output>
            </label>
        </div>

    </section>

</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <p>

        Made with ❤️ using
        HTML,
        CSS &
        JavaScript

    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="http://127.0.0.1:3000/socket.io/socket.io.js"></script>

<script src="script.js"></script>
<script src="cursor.js"></script>

</body>

</html>
