<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>LiveCanvas</title>

    <link rel="icon" type="image/png" href="assets/icon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">


    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Icons -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header>

    <!-- LOGO -->

    <div class="logo">

        <i class="fa-solid fa-pen-ruler"></i>

        <h2>LiveCanvas</h2>

    </div>


    <!-- HEADER RIGHT -->

    <div class="header-right">


        <!-- THEME PICKER -->

        <div class="theme-picker">

            <div
                class="theme-color blue"
                data-theme=""
                title="Light">
            </div>


            <div
                class="theme-color dark-theme"
                data-theme="dark"
                title="Dark">
            </div>


            <div
                class="theme-color purple"
                data-theme="purple"
                title="Purple">
            </div>


            <div
                class="theme-color green"
                data-theme="green"
                title="Green">
            </div>


            <div
                class="theme-color ocean"
                data-theme="ocean"
                title="Ocean">
            </div>

        </div>


        <!-- AUTHENTICATION -->

        <div class="auth-section">

            <span id="welcomeUser"></span>


            <button id="loginHeaderBtn">

                <i class="fa-solid fa-right-to-bracket"></i>

                Login

            </button>


            <button id="signupHeaderBtn">

                <i class="fa-solid fa-user-plus"></i>

                Signup

            </button>


            <button id="logoutBtn">

                <i class="fa-solid fa-right-from-bracket"></i>

                Logout

            </button>

        </div>


    </div>

</header>





<!-- =====================================================
     MAIN
===================================================== -->

<main>


    <!-- =================================================
         LEFT SIDEBAR
    ================================================== -->

    <aside class="sidebar">


        <!-- STICKY NOTES -->

        <div class="card">

            <h3>

                <i class="fa-solid fa-note-sticky"></i>

                Sticky Notes

            </h3>


            <button id="addNoteBtn">

                + Add Note

            </button>


            <input
                type="text"
                id="searchNote"
                placeholder="Search Notes">


            <div id="notesContainer">

            </div>

        </div>



        <!-- STATISTICS -->

        <div class="card">

            <h3>

                <i class="fa-solid fa-chart-column"></i>

                Statistics

            </h3>


            <p>

                Total Notes :

                <span id="totalNotes">
                    0
                </span>

            </p>


            <p>

                Canvas Saves :

                <span id="saveCount">
                    0
                </span>

            </p>


            <p>

                Theme :

                <span id="themeStatus">
                    Light
                </span>

            </p>

        </div>


    </aside>



    <!-- =================================================
         CANVAS
    ================================================== -->

    <section class="canvas-section">

    <!-- TOP CANVAS HEADER -->
    <div class="canvas-topbar">

        <div class="document-info">
            <span class="document-icon">
                <i class="fa-solid fa-book-open"></i>
            </span>

            <div>
                <input
                    type="text"
                    id="documentTitle"
                    value="Study Notes"
                >

                <small>LiveCanvas Document</small>
            </div>
        </div>

        <div class="collaborators">

            <span class="avatar purple">R</span>
            <span class="avatar pink">A</span>
            <span class="avatar orange">S</span>
            <span class="avatar more">+3</span>

            <button class="share-btn">
                <i class="fa-solid fa-share-nodes"></i>
                Share
            </button>

            <button class="more-btn">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

        </div>

    </div>


    <div class="canvas-toolbar">

    <!-- SELECT -->
    <button class="tool active-tool" id="selectTool" title="Select">
        <i class="fa-solid fa-arrow-pointer"></i>
    </button>

    <!-- PEN -->
    <button class="tool" id="drawBtn" title="Pen">
        <i class="fa-solid fa-pen"></i>
    </button>

    <!-- HIGHLIGHTER -->
    <button class="tool" id="highlighterBtn" title="Highlighter">
        <i class="fa-solid fa-highlighter"></i>
    </button>

    <!-- LIGHT PEN -->
    <button class="tool" id="lightPenBtn" title="Light Pen">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
    </button>

    <!-- ERASER -->
    <button class="tool" id="eraserBtn" title="Eraser">
        <i class="fa-solid fa-eraser"></i>
    </button>

    <div class="toolbar-divider"></div>

    <!-- SHAPES -->
    <button class="tool" id="shapeBtn" title="Shapes">
        <i class="fa-regular fa-square"></i>
    </button>

    <!-- TEXT -->
    <button class="tool" id="textBtn" title="Text">
        <i class="fa-solid fa-t"></i>
    </button>

    <!-- IMAGE -->
    <button class="tool" id="imageBtn" title="Image">
        <i class="fa-regular fa-image"></i>
    </button>

    <!-- STICKY -->
    <button class="tool" id="stickyBtn" title="Sticky Note">
        <i class="fa-solid fa-note-sticky"></i>
    </button>

    <!-- TABLE -->
    <button class="tool" id="tableBtn" title="Table">
        <i class="fa-solid fa-table"></i>
    </button>

    <div class="toolbar-divider"></div>

    <!-- COLOR -->
    <label class="color-tool" title="Color">
        <input
            type="color"
            id="colorPicker"
            value="#172033"
        >
    </label>

    <!-- BRUSH SIZE -->
    <input
        type="range"
        id="brushSize"
        min="1"
        max="20"
        value="4"
        class="brush-slider"
    >

    <div class="toolbar-spacer"></div>

    <!-- UNDO -->
    <button class="tool" id="undoBtn" title="Undo">
        <i class="fa-solid fa-rotate-left"></i>
    </button>

    <!-- REDO -->
    <button class="tool" id="redoBtn" title="Redo">
        <i class="fa-solid fa-rotate-right"></i>
    </button>

    <div class="toolbar-divider"></div>

    <!-- ZOOM -->
    <button class="tool" id="zoomOut" title="Zoom Out">
        <i class="fa-solid fa-minus"></i>
    </button>

    <span id="zoomValue">100%</span>

    <button class="tool" id="zoomIn" title="Zoom In">
        <i class="fa-solid fa-plus"></i>
    </button>

</div>
        
           

        
         
         

    <!-- NOTEBOOK AREA -->

    <div class="notebook-area">

        <div
            class="notebook-page"
            id="notebookPage"
        >

            <!-- PAPER -->

            <div class="paper-background"></div>

            <!-- CANVAS -->

            <canvas
                id="drawingBoard"
                width="1000"
                height="700"
            ></canvas>

            <!-- OBJECT LAYER -->

            <div
                class="object-layer"
                id="objectLayer"
            ></div>

        </div>


        <!-- PAGE CONTROLS -->

        <div class="page-controls">

            <button
                class="page-btn"
                id="previousPage"
            >
                <i class="fa-solid fa-chevron-left"></i>
            </button>


            <span id="pageNumber">
                1 / ∞
            </span>


            <button
                class="page-btn"
                id="nextPage"
            >
                <i class="fa-solid fa-chevron-right"></i>
            </button>

        </div>


        <!-- ADD PAGE -->

        <button
            class="add-page-btn"
            id="addPageBtn"
        >

            <i class="fa-solid fa-plus"></i>

            Add Page

        </button>


        <!-- EXTEND PAGE -->

        <button
            class="extend-page-btn"
            id="extendPageBtn"
        >

            <i class="fa-solid fa-arrows-up-down"></i>

            Extend Page

        </button>

    </div>

</section>



</main>



<!-- =====================================================
     FOOTER
===================================================== -->

<footer>

    <p>

        Made with ❤️ using
        HTML,
        CSS &
        JavaScript

    </p>

</footer>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->
<script src="/socket.io/socket.io.js"></script>
<script src="script.js"></script>


</body>

</html>
