<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signup - LiveCanvas</title>

    <link rel="icon" type="image/png" href="assets/logo.png">


    <!-- Google Font -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


    <!-- Authentication CSS -->

    <link rel="stylesheet"
          href="auth.css">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-visual">
                <img src="assets/signup.png" alt="Signup visual">
            </div>

            <div class="auth-form">

                <!-- Logo -->

                <div class="auth-logo">
                    <img src="assets/logo_bg.png" alt="LiveCanvas" class="auth-logo-img">
                    <h2>LiveCanvas</h2>
                </div>


                <!-- Heading -->

                <h1>Create Account</h1>

                <p class="subtitle">
                    Join LiveCanvas and start creating
                </p>


                <!-- NAME -->

                <div class="input-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        autocomplete="name">

                </div>


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email">

                </div>


                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password">

                </div>


                <p id="formMessage" class="form-message" aria-live="polite"></p>

                <!-- SIGNUP BUTTON -->

                <button id="signupBtn">


                    Create Account

                </button>


                <!-- LOGIN -->

                <p class="switch-text">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </p>


                <!-- BACK -->

                <!-- <p class="back-text">

                    <a href="index.html">
                        Back to Whiteboard
                    </a>

                </p> -->

            </div>

        </div>

    </div>


    <!-- Signup JavaScript -->

    <script src="signup.js"></script>

</body>

</html>
